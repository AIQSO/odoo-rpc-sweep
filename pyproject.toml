[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "odoo-rpc-sweep"
dynamic = ["version"]
description = "Find legacy Odoo XML-RPC / JSON-RPC calls in your integration code before Odoo removes them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "AIQSO", email = "odoo-apps@aiqso.io" }]
keywords = ["odoo", "xmlrpc", "jsonrpc", "json-2", "migration", "upgrade", "n8n"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
odoo-rpc-sweep = "odoo_rpc_sweep.sweep:main"

[project.urls]
Homepage = "https://github.com/AIQSO/odoo-rpc-sweep"
Issues = "https://github.com/AIQSO/odoo-rpc-sweep/issues"

[tool.hatch.version]
path = "src/odoo_rpc_sweep/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]
